version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # Group minor/patch updates together to keep PR noise down
      patch-updates:
        update-types: ["minor", "patch"]
        exclude-patterns: ["next", "react", "react-dom", "@prisma/*", "prisma"]
    # Patch security advisories immediately
    versioning-strategy: "increase-if-necessary"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
